<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MoustaTrade - Rejoins le canal Telegram</title>
  <style>
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); 
      margin:0; padding:0; color:#000; 
    }
    .container { 
      max-width: 500px; 
      margin: 0 auto; 
      padding: 20px; 
      background: white; 
      min-height: 100vh; 
    }
    header { text-align: center; padding: 40px 0 20px; }
    .avatar { 
      width: 100px; 
      height: 100px; 
      border-radius: 50%; 
      object-fit: cover; 
      border: 4px solid #0088cc; 
    }
    h1 { 
      font-size: 32px; 
      margin: 10px 0; 
      background: linear-gradient(90deg, #00ffea, #7f00ff, #ff00aa); 
      -webkit-background-clip: text; 
      -webkit-text-fill-color: transparent; 
    }
    .emoji { font-size: 40px; } 
    .btn { 
      display: block; 
      background: #0088cc; 
      color: white; 
      text-align: center; 
      padding: 16px; 
      border-radius: 30px; 
      font-size: 18px; 
      font-weight: bold; 
      text-decoration: none; 
      margin: 30px auto; 
      max-width: 300px; 
    }
    .steps { margin: 40px 0; }
    .step { display: flex; align-items: center; margin: 20px 0; }
    .number { 
      background: #0088cc; 
      color: white; 
      width: 40px; 
      height: 40px; 
      border-radius: 50%; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      font-weight: bold; 
      margin-right: 15px; 
      flex-shrink:0; 
    }
    .instruction { font-size: 17px; }
    .highlight { 
      background: #e6f3ff; 
      padding: 12px; 
      border-radius: 12px; 
      margin: 8px 0; 
      font-weight: bold; 
      text-align: center; 
    }
    .footer-text { 
      text-align: center; 
      color: #666; 
      margin-top: 50px; 
      font-size: 16px; 
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <!-- Remplace par ton logo uploadé si tu veux -->
      <!-- <img src="https://i.imgur.com/TONLOGO.jpg" alt="MoustaTrade" class="avatar"/> -->
      <h1>MoustaTrade <span class="emoji">📈</span></h1>
      <p>Canal Telegram</p>
    </header>

    <a href="https://t.me/+rPv8mmolH8plYmJk" class="btn">🚀 Rejoins le canal maintenant</a>

    <div class="steps">
      <h2 style="text-align:center; color:#0088cc;">2 ÉTAPES RAPIDES</h2>
      
      <div class="step">
        <div class="number">1</div>
        <div class="instruction">Clique sur les 3 points</div>
      </div>
      
      <div class="highlight">
        … en haut à droite
      </div>
      
      <div class="step">
        <div class="number">2</div>
        <div class="instruction">Sélectionne</div>
      </div>
      
      <div class="highlight">
        Ouvrir dans le navigateur
      </div>
    </div>

    <p class="footer-text">
      Le canal s'ouvrira automatiquement ✨
    </p>
  </div>
</body>
</html>
